<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Feedback Form</h1>
        <div class="feedback-card">
            <h2>Silahkan berikan umpan balik Anda:</h2>

            <label for="name">Nama:</label>
            <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>

            <label for="class-type">Jenis Kelas:</label>
            <select id="class-type" name="class-type" required>
                <option value="">Pilih Jenis Kelas</option>
                <option value="regular">Regular</option>
                <option value="intensive">Intensive</option>
            </select>

            <label for="category">Kategori:</label>
            <select id="category" name="category" required>
                <option value="">Pilih Kategori</option>
                <option value="junior">Junior</option>
                <option value="middle">Middle</option>
                <option value="senior">Senior</option>
            </select>

            <label>Rating: </label>
            <div class="rating">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <p id="ratingText">Belum ada rating yang dipilih</p>
            
            <label for="komentar">Komentar: </label>
            <textarea id="komentar" rows="5" placeholder="Tulis komentar Anda di sini..."></textarea>
        
            <div class="button-group">
                <button class="btn-submit" onclick="kirimFeedback()">Kirim Feedback</button>
                <button class="btn-reset" onclick="resetForm()">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
