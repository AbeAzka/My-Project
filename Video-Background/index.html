<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Background</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <div class="logo">
            Marvel Cinematic Universe
        </div>
        <nav>
            <ul>
               <li><a href="#" onclick="videoUrl('https://www.pexels.com/download/video/37903213/', 
                    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 
                    'Spiderman: Brand New Day', 
                    'Brand new day for Spiderman.')">
                    Spiderman: Brand New Day</a>
                </li>

                <li><a href="#" onclick="videoUrl('https://www.pexels.com/download/video/38663926/', 
                    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 
                    'Avengers', 
                    'The Avengers are a team of superheroes who work together to protect the world.')">
                    Avengers</a>
                </li>

                <li><a href="#" onclick="videoUrl('https://www.pexels.com/download/video/38579379/', 
                    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 
                    'Hulk', 
                    'Hulk is a fictional character appearing in American comic books published by Marvel Comics.')">
                   Hulk</a>
                </li>

                <li><a href="#" onclick="videoUrl('https://www.pexels.com/download/video/25859208/', 
                    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 
                    'Iron Man', 
                    'Tony Stark is a billionaire industrialist and genius inventor who becomes the superhero Iron Man.')">
                    Iron Man</a>
                </li>

                <li><a href="#" onclick="videoUrl('https://www.pexels.com/download/video/37408822/', 
                    'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 
                    'Dr. Strange', 
                    'Dr. Strange is a fictional character appearing in American comic books published by Marvel Comics.')">
                    Dr. Strange</a>
                </li>
            </ul>
        </nav>
    </header>

    <video id="bg-video" src="https://www.pexels.com/download/video/37903213/" autoplay loop muted></video>
    <audio id="bg-audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" autoplay loop muted></audio>
    
    <div class="container">
        <div class="text">
            <h2>FEATURED MOVIE SHOWCASE</h2>
            <h3 id="video-title">Spiderman: Brand New Day</h3>
            <p id="video-desc">The new series from spiderman.</p>
        </div>
    </div>
    
    <button id="play-btn">
        <img id="play-img" src="https://img.icons8.com/ios-filled/50/ffffff/pause--v1.png" alt="Play/Pause Icon">
    </button>
    
    <script src="script.js"></script>
</body>
</html>
