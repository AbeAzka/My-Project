<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Contact Us</h2>
        <p class="subtitle">Please fill out the form below and we will get back to you as soon as possible.</p>
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
                <small class="error-msg" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
                <small class="error-msg" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (10 Digits):</label>
                <input type="tel" id="phone" name="phone" placeholder="1234567890" required>
                <small class="error-msg" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a topic</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>
                <small class="error-msg" id="subjectError"></small>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Your message here..." required></textarea>
                <small class="error-msg" id="messageError"></small>
            </div>

            <!-- BAGIAN CHECKBOX YANG DIPERBAIKI -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label class="checkbox-label" for="terms">I agree to the Privacy Policy and terms and conditions</label>
                </div>
                <small class="error-msg" id="termsError"></small>
            </div>

            <button type="submit" class="submitBtn">Submit</button>
            <div id="statusMessage" class="status-message"></div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
